name: release

# Runs when a version tag is pushed: builds, creates the GitHub release and uploads to
# Modrinth.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # The MODRINTH_TOKEN secret is in this environment, which only v* tags may use.
    environment: modrinth
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The changelog section is picked by its tag, the jar names and Modrinth version come
      # from mod.version.
      - name: Check tag matches mod.version
        run: |
          VERSION=$(grep -E '^mod\.version' stonecutter.properties.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_TYPE" != tag ] || [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Run this on the tag v$VERSION (mod.version), not on '$GITHUB_REF_NAME'."; exit 1
          fi

      - name: Build and run GameTests
        run: ./gradlew build --stacktrace

      # GameTest report and test server logs, only when something failed.
      - name: Store reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
            **/build/run/gameTest/logs/
            **/build/run/gameTest/crash-reports/

      # Takes the "## <version>" section of CHANGELOG.md. build.gradle.kts does the same for
      # Modrinth.
      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v h="## $VERSION" '
            $0 ~ "^"h {grab=1; next}
            grab && /^## / {exit}
            grab {print}
          ' CHANGELOG.md)
          {
            echo "notes<<CHANGELOG_EOF"
            echo "$NOTES"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # build/libs/ only holds the mod jars, one per target.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Eviction Notice ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.notes }}
          generate_release_notes: true
          files: build/libs/*.jar

      # Needs the MODRINTH_TOKEN secret, a Modrinth token with "Create versions". Without it
      # publishMods would only do a dry run, so the step fails instead.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then echo "MODRINTH_TOKEN secret is not set."; exit 1; fi
          ./gradlew publishMods --stacktrace
