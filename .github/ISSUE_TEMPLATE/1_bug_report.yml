name: Bug report
description: Something doesn't work the way it should, including problems with other mods.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can I reproduce it?
      description: The commands you ran and what you did, step by step.
      placeholder: |
        1. /eviction set home 24
        2. ...
    validations:
      required: true
  - type: input
    id: mod-version
    attributes:
      label: Eviction Notice version
      description: The jar name is fine, e.g. eviction-notice-1.2.0+26.1-26.3.jar
    validations:
      required: true
  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "26.3"
    validations:
      required: true
  - type: input
    id: loader-version
    attributes:
      label: Fabric Loader and Fabric API versions
      placeholder: Loader 0.19.5, Fabric API 0.160.5+26.3
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Where does it happen?
      options:
        - Singleplayer
        - LAN
        - Dedicated server
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Your mod list, or the name of the modpack and its version. Write "none" if it's only Eviction Notice and Fabric API.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Upload logs/latest.log to https://mclo.gs and paste the link here, or drag the file into this box. For a crash, add the crash report from crash-reports/ too.
    validations:
      required: false
