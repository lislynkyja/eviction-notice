name: Question
description: Not sure how something works, or whether it's supposed to do that.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: What do you want to know?
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Eviction Notice and Minecraft version
      description: Only if it's about something in your game.
      placeholder: 1.2.0, Minecraft 26.3
    validations:
      required: false
